name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./proj/*" | head -1)
          if [ -n "$SETTINGS" ]; then
            DIR=$(dirname "$SETTINGS")
          else
            ZIP=$(find . -iname "*.zip" | head -1)
            if [ -z "$ZIP" ]; then
              echo "No project or zip found"; ls -R | head -50; exit 1
            fi
            mkdir proj
            unzip -q "$ZIP" -d proj
            DIR=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          fi
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BrainBoost-APKs
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
